# Configuração mínima para publicar as Edge Functions com a CLI do Supabase.
# Ligue a pasta ao projeto uma vez: supabase link --project-ref zvgchncgvadzpkffhfbr
project_id = "ka-tech"

# Chamada pelo gatilho do banco (pg_net) sem login; a função confere o
# cabeçalho x-index-secret ou o login de um admin/instrutor.
[functions.index-lesson]
verify_jwt = false

[functions.search-lessons]
verify_jwt = true

# Também chamada pela fila "rascunhar-quizzes" (pg_net, x-index-secret);
# a função confere o segredo ou o login de um admin/instrutor.
[functions.generate-quiz]
verify_jwt = false
