# Publica o banco e as Edge Functions do Supabase quando a main muda em supabase/.
#  1. Migrações novas de supabase/migrations (o banco guarda quais já rodaram).
#  2. Todas as Edge Functions (verify_jwt de cada uma vem de supabase/config.toml).
#
# Segredos do repositório (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal: supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   senha do banco: Project Settings → Database
name: Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

# Uma publicação por vez; a próxima espera a anterior terminar
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: zvgchncgvadzpkffhfbr
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Ligar ao projeto
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Migrações pendentes
        run: |
          supabase migration list
          supabase db push --include-all

      - name: Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
